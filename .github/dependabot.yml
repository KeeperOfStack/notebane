# Dependabot version updates — weekly PRs that bump dependencies; CI runs on
# each one. Nothing merges automatically. See docs/releasing.md.
version: 2

updates:
  # Python: requirements.in (direct deps) → requirements.txt (hash-pinned lock,
  # regenerated by Dependabot with the pip-compile command in its header),
  # plus requirements-dev.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # yt-dlp floats on purpose: installed --pre at build and upgraded on
      # every container start (YouTube breaks old versions within weeks).
      - dependency-name: yt-dlp
      - dependency-name: yt-dlp-ejs
      # davey 0.2.0: DAVE session never reports ready → audio sent unencrypted,
      # Discord clients drop it (bot "speaks", nobody hears). All CI passes, so
      # it must be excluded here. Later releases (0.2.1+) still arrive as
      # voice-stack PRs for a manual playback test.
      - dependency-name: davey
        versions: ["0.2.0"]
    groups:
      # discord.py / davey / PyNaCl together. These PRs get the
      # `needs-voice-test` label + checklist (dependabot-voice-label.yml):
      # davey 0.2.0 once silently broke all audio.
      voice-stack:
        patterns: ["discord.py", "davey", "pynacl", "PyNaCl"]
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["discord.py", "davey", "pynacl", "PyNaCl", "yt-dlp", "yt-dlp-ejs"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]

  # Base image (python:3.12-alpine): patch/digest updates only — moving to a
  # new Python minor version is a deliberate change, not a weekly bump.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    labels: [dependencies]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
