# Production compose — uses pre-built GHCR image instead of local build.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Create .env from .env.example and fill in DISCORD_TOKEN + APPLICATION_ID
#   2. (Optional) Set METRICS_PORT=9090 and uncomment the ports section below
#
# Auto-updates:
#   Watchtower polls GHCR every 5 minutes and automatically pulls + recreates
#   the notebane container when a new image is published.  Slash commands and
#   interactive buttons are always re-synced on restart — no user action needed.

services:
  notebane:
    image: ghcr.io/keeperofstack/notebane:latest
    container_name: notebane
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_FORMAT: json         # structured JSON logs for aggregators
      PUID: 1000               # host user ID to run as — match your Docker host user
      PGID: 1000               # host group ID to run as — match your Docker host group
    volumes:
      - notebane_cookies:/cookies  # per-guild YouTube cookies from /ytlogin
      - notebane_data:/data        # SQLite DB — queue snapshots + user playlists
    # Uncomment to expose Prometheus /metrics + /health (set METRICS_PORT in .env)
    # ports:
    #   - "9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s     # allow graceful VC disconnect before SIGKILL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: notebane-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 300          # check for new image every 5 minutes
      WATCHTOWER_CLEANUP: "true"             # remove old images after update
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_LABEL_ENABLE: "true"        # only update containers with the label
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # If your GHCR image is private, supply credentials:
    # environment:
    #   REPO_USER: your-github-username
    #   REPO_PASS: your-github-pat-with-read:packages-scope

volumes:
  notebane_cookies:
  notebane_data:
